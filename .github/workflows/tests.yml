name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_mini_logistics
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Prepare .env for tests
        run: |
          # ✅ Создаём .env с правильным портом 5433
          cat > .env << 'EOF'
          DATABASE_URL=postgresql+asyncpg://test_user:test_pass@localhost:5433/test_mini_logistics
          TEST_DATABASE_URL=postgresql+asyncpg://test_user:test_pass@localhost:5433/test_mini_logistics
          SECRET_KEY=ci-cd-test-secret-key-not-for-production
          ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=30
          TESTING=true
          EOF
          
          echo "✅ .env created:"
          cat .env
      - name: Run tests with coverage
        run: |
          pytest app/tests/ --cov=app --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false